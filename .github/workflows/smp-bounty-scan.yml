name: SMP bounty scan

on:
  push:
    branches:
      - fix/smp-thread-suspend-resume
  workflow_dispatch:

jobs:
  interrupt-stress:
    strategy:
      fail-fast: false
      matrix:
        mode: [unicore, smp-p1, smp-p2, smp-p4]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) ./configure --enable-c-opt=-O1 ;;
            smp-p1|smp-p2|smp-p4) ./configure --enable-smp --enable-multiple-threaded-vms --enable-c-opt=-O1 ;;
          esac
      - name: Build core
        run: make -j2 core
      - name: Check no-thunk interrupt target
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p1) opts="-:p1,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac
          timeout 15s ./gsi/gsi $opts -f tests/unit-tests/06-thread/thread_interrupt_no_thunk_target.scm
      - name: Check suspend resume semantics
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p1) opts="-:p1,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac
          timeout 15s ./gsi/gsi $opts -f tests/unit-tests/06-thread/thread_suspend_resume_behavior.scm
      - name: Scale official interrupt stress test
        shell: bash
        run: |
          sed 's/(define iterations 1000000)/(define iterations 10000)/' \
            tests/unit-tests/06-thread/thread_interrupt2_stress.scm > /tmp/thread_interrupt2_stress_scaled.scm
          grep 'define iterations' /tmp/thread_interrupt2_stress_scaled.scm
      - name: Repeat scaled interrupt stress
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p1) opts="-:p1,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac

          failures=0
          timeouts=0
          crashes=0
          passes=0
          for i in $(seq 1 6); do
            out=$(mktemp)
            timeout 25s ./gsi/gsi $opts -f /tmp/thread_interrupt2_stress_scaled.scm >"$out" 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              passes=$((passes+1))
            else
              failures=$((failures+1))
              if [ $rc -eq 124 ]; then
                timeouts=$((timeouts+1))
              elif [ $rc -ge 128 ]; then
                crashes=$((crashes+1))
              fi
              echo "FAIL|${{ matrix.mode }}|run=$i|rc=$rc"
              tail -80 "$out"
            fi
            rm -f "$out"
          done

          echo "INTERRUPT_STRESS|mode=${{ matrix.mode }}|passes=$passes|failures=$failures|timeouts=$timeouts|crashes=$crashes"
          exit 0
