name: SMP bounty scan

on:
  push:
    branches:
      - fix/smp-thread-suspend-resume
  workflow_dispatch:

jobs:
  thread-sweep:
    strategy:
      fail-fast: false
      matrix:
        mode: [unicore, smp-p1, smp-p2, smp-p4]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) ./configure --enable-c-opt=-O1 ;;
            smp-p1|smp-p2|smp-p4) ./configure --enable-smp --enable-multiple-threaded-vms --enable-c-opt=-O1 ;;
          esac
      - name: Build core
        run: make -j2 core
      - name: Repeat stock 06-thread tests
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p1) opts="-:p1,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac

          upstream_tests='current_processor.scm current_thread.scm issue_174.scm issue_216.scm make_mutex.scm make_thread.scm mutex_lock.scm mutex_race.scm mutex_race_timeout.scm mutex_unlock_plain.scm processorp.scm tfib_stress.scm thread.scm thread_init.scm thread_interrupt.scm thread_interrupt2.scm thread_join.scm thread_name.scm thread_quantum.scm thread_sleep.scm thread_specific.scm thread_state.scm thread_terminate.scm thread_thread_group.scm thread_yield.scm threadp.scm'

          for test in $upstream_tests; do
            [ -f "tests/unit-tests/06-thread/$test" ] || continue
            # Already investigated separately, or intentionally huge stress cases.
            case "$test" in
              mutex_race_timeout.scm|tfib_stress.scm) reps=8 ;;
              issue_216.scm|thread_interrupt.scm|thread_interrupt2.scm) reps=20 ;;
              *) reps=30 ;;
            esac
            pass=0; fail=0; timeout_count=0; crash=0
            first_rc=''
            first_tail=''
            for i in $(seq 1 $reps); do
              out=$(mktemp)
              timeout 12s ./gsi/gsi $opts -f "tests/unit-tests/06-thread/$test" >"$out" 2>&1
              rc=$?
              if [ $rc -eq 0 ]; then
                pass=$((pass+1))
              else
                fail=$((fail+1))
                [ $rc -eq 124 ] && timeout_count=$((timeout_count+1))
                [ $rc -ge 128 ] && crash=$((crash+1))
                if [ -z "$first_rc" ]; then
                  first_rc=$rc
                  first_tail=$(tail -8 "$out" | tr '\n' ' ')
                fi
              fi
              rm -f "$out"
            done
            echo "THREAD_SWEEP|mode=${{ matrix.mode }}|test=$test|pass=$pass|fail=$fail|timeouts=$timeout_count|crashes=$crash|first_rc=${first_rc:-0}"
            if [ $fail -gt 0 ]; then echo "FIRST_FAILURE|mode=${{ matrix.mode }}|test=$test|$first_tail"; fi
          done
          exit 0
