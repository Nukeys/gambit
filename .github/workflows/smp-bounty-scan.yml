name: SMP bounty scan

on:
  push:
    branches:
      - fix/smp-thread-suspend-resume
  workflow_dispatch:

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        mode: [unicore, smp-p1, smp-p2, smp-p4]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) ./configure --enable-c-opt=-O1 ;;
            smp-p1|smp-p2|smp-p4) ./configure --enable-smp --enable-multiple-threaded-vms --enable-c-opt=-O1 ;;
          esac
      - name: Build core
        run: make -j2 core
      - name: Full unit-suite failure list
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
            smp-p1) opts="-:p1,m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
            smp-p2) opts="-:p2,m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
            smp-p4) opts="-:p4,m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
          esac
          cd tests
          out=$(mktemp)
          timeout 300s ../gsi/gsi $opts -f ./run-unit-tests.scm >"$out" 2>&1
          rc=$?
          echo "UNIT_SUITE|mode=${{ matrix.mode }}|rc=$rc"
          grep '^\*\*\* FAILED' "$out" || true
          grep -E '^(FAILED|PASSED) [0-9]+ UNIT TEST' "$out" || true
          if [ $rc -eq 124 ]; then echo "UNIT_SUITE_TIMEOUT|mode=${{ matrix.mode }}"; fi
          rm -f "$out"
          exit 0
      - name: Repeat suspicious stock tests
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p1) opts="-:p1,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac
          for test in 09-io/write_read.scm 15-misc/serdes.scm; do
            pass=0; fail=0; timeout_count=0; crash=0
            for i in $(seq 1 50); do
              out=$(mktemp)
              timeout 10s ./gsi/gsi $opts -f "tests/unit-tests/$test" >"$out" 2>&1
              rc=$?
              if [ $rc -eq 0 ]; then
                pass=$((pass+1))
              else
                fail=$((fail+1))
                [ $rc -eq 124 ] && timeout_count=$((timeout_count+1))
                [ $rc -ge 128 ] && crash=$((crash+1))
              fi
              rm -f "$out"
            done
            echo "REPEAT|mode=${{ matrix.mode }}|test=$test|pass=$pass|fail=$fail|timeouts=$timeout_count|crashes=$crash"
          done
          exit 0
      - name: Scaled official interrupt stress
        shell: bash
        run: |
          set +e
          testdir=tests/unit-tests/06-thread
          scaled="$testdir/thread_interrupt2_stress_scaled_tmp.scm"
          sed 's/(define iterations 1000000)/(define iterations 10000)/' "$testdir/thread_interrupt2_stress.scm" > "$scaled"
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p1) opts="-:p1,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac
          pass=0; fail=0; timeout_count=0; crash=0
          for i in $(seq 1 10); do
            out=$(mktemp)
            timeout 25s ./gsi/gsi $opts -f "$scaled" >"$out" 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
              [ $rc -eq 124 ] && timeout_count=$((timeout_count+1))
              [ $rc -ge 128 ] && crash=$((crash+1))
              echo "INTERRUPT_FAIL|mode=${{ matrix.mode }}|run=$i|rc=$rc"
              tail -30 "$out"
            fi
            rm -f "$out"
          done
          rm -f "$scaled"
          echo "INTERRUPT_STRESS|mode=${{ matrix.mode }}|pass=$pass|fail=$fail|timeouts=$timeout_count|crashes=$crash"
          exit 0
