name: SMP bounty scan

on:
  push:
    branches:
      - fix/smp-thread-suspend-resume
  workflow_dispatch:

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        mode: [unicore, smp-p1, smp-p2, smp-p4]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) ./configure --enable-c-opt=-O1 ;;
            *) ./configure --enable-smp --enable-multiple-threaded-vms --enable-c-opt=-O1 ;;
          esac
      - name: Build core
        run: make -j2 core
      - name: Run stress candidates
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p1) opts="-:p1,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac
          failures=0
          for name in thread_interrupt2_stress.scm thread_interrupt_stress.scm tfib_stress.scm; do
            echo "===== ${{ matrix.mode }} $name ====="
            timeout 90s ./gsi/gsi $opts -f "tests/unit-tests/06-thread/$name"
            rc=$?
            echo "RESULT ${{ matrix.mode }} $name rc=$rc"
            if [ $rc -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "STRESS_SCAN mode=${{ matrix.mode }} failures=$failures"
          exit 0
