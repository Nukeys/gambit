name: SMP bounty scan

on:
  push:
    branches:
      - fix/smp-thread-suspend-resume
  workflow_dispatch:

jobs:
  unit-diff:
    strategy:
      fail-fast: false
      matrix:
        mode: [unicore, smp-p2]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) ./configure --enable-c-opt=-O1 ;;
            smp-p2) ./configure --enable-smp --enable-multiple-threaded-vms --enable-c-opt=-O1 ;;
          esac
      - name: Build core
        run: make -j2 core
      - name: Scan non-stress unit tests
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac

          failures=0
          total=0
          while IFS= read -r f; do
            total=$((total+1))
            out=$(mktemp)
            timeout 8s ./gsi/gsi $opts -f "$f" >"$out" 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              failures=$((failures+1))
              echo "FAIL|${{ matrix.mode }}|$f|rc=$rc"
              tail -20 "$out"
            fi
            rm -f "$out"
          done < <(find tests/unit-tests -type f -name '*.scm' ! -name '#.scm' ! -name '*stress*.scm' | sort)

          echo "UNIT_DIFF|mode=${{ matrix.mode }}|total=$total|failures=$failures"
          exit 0
