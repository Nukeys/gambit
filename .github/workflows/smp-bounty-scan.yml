name: SMP bounty scan

on:
  push:
    branches:
      - fix/smp-thread-suspend-resume
  workflow_dispatch:

jobs:
  mutex-timeout-race:
    strategy:
      fail-fast: false
      matrix:
        mode: [unicore, smp-p2, smp-p4]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) ./configure --enable-c-opt=-O1 ;;
            smp-p2|smp-p4) ./configure --enable-smp --enable-multiple-threaded-vms --enable-c-opt=-O1 ;;
          esac
      - name: Build core
        run: make -j2 core
      - name: Repeat mutex_race_timeout
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p2) opts="-:p2,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
            smp-p4) opts="-:p4,m128M,~~bin=./bin,~~lib=./lib,~~include=./include" ;;
          esac

          failures=0
          timeouts=0
          crashes=0
          passes=0
          for i in $(seq 1 40); do
            out=$(mktemp)
            timeout 15s ./gsi/gsi $opts -f tests/unit-tests/06-thread/mutex_race_timeout.scm >"$out" 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              passes=$((passes+1))
            else
              failures=$((failures+1))
              if [ $rc -eq 124 ]; then
                timeouts=$((timeouts+1))
              elif [ $rc -ge 128 ]; then
                crashes=$((crashes+1))
              fi
              echo "FAIL|${{ matrix.mode }}|run=$i|rc=$rc"
              tail -60 "$out"
            fi
            rm -f "$out"
          done

          echo "MUTEX_TIMEOUT_RACE|mode=${{ matrix.mode }}|passes=$passes|failures=$failures|timeouts=$timeouts|crashes=$crashes"
          exit 0
