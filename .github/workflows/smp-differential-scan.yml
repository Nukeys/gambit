name: SMP differential scan

on:
  push:
    branches:
      - hunt/smp-differential
  workflow_dispatch:

jobs:
  unit-diff:
    strategy:
      fail-fast: false
      matrix:
        mode: [unicore, smp-p1, smp-p2, smp-p4]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          case "${{ matrix.mode }}" in
            unicore) ./configure --enable-c-opt=-O1 ;;
            smp-p1|smp-p2|smp-p4) ./configure --enable-smp --enable-multiple-threaded-vms --enable-c-opt=-O1 ;;
          esac
      - name: Build core
        run: make -j2 core
      - name: Run unit suite and print failures only
        shell: bash
        run: |
          set +e
          case "${{ matrix.mode }}" in
            unicore) opts="-:m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
            smp-p1) opts="-:p1,m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
            smp-p2) opts="-:p2,m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
            smp-p4) opts="-:p4,m256M,~~bin=../bin,~~lib=../lib,~~include=../include" ;;
          esac
          cd tests
          out=$(mktemp)
          timeout 300s ../gsi/gsi $opts -f ./run-unit-tests.scm >"$out" 2>&1
          rc=$?
          echo "UNIT_SUITE|mode=${{ matrix.mode }}|rc=$rc"
          grep -E '^\*\*\* FAILED|^FAILED [0-9]+ UNIT TEST|^PASSED [0-9]+ UNIT TEST' "$out" || true
          if [ $rc -eq 124 ]; then
            echo "UNIT_SUITE_TIMEOUT|mode=${{ matrix.mode }}"
            tail -100 "$out"
          fi
          rm -f "$out"
          exit 0
